[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids"
version = "0.1.0"
description = "Comparative benchmark of ML classifiers for network intrusion detection (CICIDS2017)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5,<1.7",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "shap>=0.45",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5"]
onnx = ["skl2onnx>=1.16", "onnxruntime>=1.17", "onnxmltools>=1.12"]
dev = ["pytest>=8"]

[project.scripts]
ids = "ids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
